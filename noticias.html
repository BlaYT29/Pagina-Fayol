<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Noticias del Colegio Henri Fayol"
  >

  <title>
    Noticias | Colegio Henri Fayol
  </title>

  <link
  rel="icon"
  type="image/png"
  href="assets/logo/logo.png"
>

  <link
    rel="stylesheet"
    href="css/global.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/footer.css"
  >

  <link
    rel="stylesheet"
    href="css/noticias.css"
  >

</head>


<body>

  <div id="header-container"></div>


  <main>

    <section class="news-page-hero">

      <div class="container">

        <span>
          Colegio Henri Fayol
        </span>

        <h1>
          Noticias y actualidad
        </h1>

        <p>
          Conoce las actividades,
          celebraciones, información
          y novedades de nuestra
          comunidad educativa.
        </p>

      </div>

    </section>


    <section class="news-page-content">

      <div class="container">

        <div class="news-controls">

          <div class="news-search">

            <input
              type="search"
              id="news-search-input"
              placeholder="Buscar una noticia..."
              aria-label="Buscar noticias"
            >

          </div>


          <div
            class="news-categories"
            id="news-categories"
          ></div>

        </div>


        <div
          id="featured-news"
        ></div>


        <h2 class="all-news-title">
          Todas las noticias
        </h2>


        <div
          class="news-page-grid"
          id="news-page-grid"
        ></div>


        <div
          class="load-more-wrapper"
          id="load-more-wrapper"
        >

          <button
            class="load-more-button"
            id="load-more-button"
          >
            Ver más noticias
          </button>

        </div>

      </div>

    </section>

  </main>


  <div id="footer-container"></div>


  <script src="js/header.js"></script>

  <script src="js/main.js"></script>

  <script src="js/noticias.js"></script>

</body>

</html>
